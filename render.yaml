services:
  - type: web
    name: lifeos-backend
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: lifeos-db
          property: connectionString

      - key: FRONTEND_URL
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: SESSION_SECRET
        generateValue: true

      - key: GOOGLE_CALLBACK_URL
        sync: false

databases:
  - name: lifeos-db
    plan: free
    databaseName: lifeos
    user: lifeos